<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Housebets — Sportsbook Prototype</title>
<link rel="stylesheet" href="styles.css?v=19">
</head>
<body>

<header class="topbar">
  <button class="logo" data-action="nav" data-view="home" aria-label="Housebets home">
    <img class="logo-img" src="logo.svg" alt="Housebets">
  </button>

  <div class="topbar-search">
    <span class="search-ico" aria-hidden="true">🔍</span>
    <input id="globalSearch" type="search" placeholder="Search teams, players or leagues" autocomplete="off">
  </div>

  <div class="topbar-right">
    <div class="balance-pill" title="Your balance">
      <span class="bal-label">Balance</span>
      <span id="balanceValue">1,250.00</span>
      <span class="usdt">USDT</span>
    </div>
    <button class="avatar" data-action="avatar" title="Your account" aria-label="Your account">🦥</button>
  </div>
</header>

<div class="ticker" id="ticker" aria-label="Live scores ticker">
  <span class="ticker-live">🔴 LIVE <b id="tickerCount"></b></span>
  <div class="ticker-track" id="tickerTrack"></div>
</div>

<div class="layout">

  <aside class="sidebar" aria-label="Sports navigation">
    <div class="side-section">
      <button class="nav-item" data-action="nav" data-view="home">⚽ <span>Sports Bet</span></button>
      <button class="nav-item" data-action="nav" data-view="live">🔴 <span>Live</span> <span class="live-count" id="liveCount"></span></button>
      <button class="nav-item" data-action="nav" data-view="football">⚽ <span>Football</span></button>
    </div>
    <div class="side-title">Sports</div>
    <div id="sportList"></div>
    <div class="side-note">🦥 Slow and steady<br>wins the bet.</div>
  </aside>

  <main id="main" class="main"></main>

  <aside class="rail" id="rail" aria-label="Bet slip and my bets">
    <div class="rail-head">
      <div class="rail-tabs" role="tablist">
        <button class="rail-tab" data-action="rail-tab" data-tab="slip" id="tabSlip">Bet Slip <span class="count-badge" id="slipCount">0</span></button>
        <button class="rail-tab" data-action="rail-tab" data-tab="mybets" id="tabMyBets">My Bets <span class="count-badge mint" id="myBetsCount">0</span></button>
      </div>
      <button class="rail-gear" data-action="slip-settings" aria-label="Bet slip settings" title="Bet slip settings">⚙️</button>
      <button class="rail-close" data-action="close-rail" aria-label="Close">✕</button>
    </div>
    <div class="rail-body" id="railBody"></div>
  </aside>

</div>

<div class="sheet-backdrop" id="sheetBackdrop" data-action="close-rail"></div>

<button class="slipbar" id="slipBar" data-action="open-rail" hidden>
  <span class="slipbar-left">🧾 Bet Slip <span class="count-badge" id="slipBarCount">0</span></span>
  <span class="slipbar-right">Total odds <b id="slipBarOdds">1.00</b> ›</span>
</button>

<nav class="bottomnav" aria-label="Mobile navigation">
  <button data-action="open-menu"><span class="bn-ico">☰</span>More</button>
  <button data-action="nav" data-view="home"><span class="bn-ico">⚽</span>Sports</button>
  <button class="bn-slip" data-action="open-rail"><span class="bn-ico">🧾</span>Slip <span class="count-badge bn-badge" id="bnSlipCount">0</span></button>
  <button data-action="open-mybets"><span class="bn-ico">🎟️</span>My Bets</button>
</nav>

<div class="drawer-backdrop" id="drawerBackdrop" data-action="close-menu" hidden></div>
<aside class="drawer" id="drawer" aria-label="Menu">
  <div class="drawer-head">
    <span class="drawer-logo"><img class="logo-img" src="logo.svg" alt="Housebets"></span>
    <button class="drawer-close" data-action="close-menu" aria-label="Close menu">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="modal-backdrop" id="settingsBackdrop" data-action="settings-close" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="Bet slip settings" id="settingsModal"></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="app.js?v=19"></script>
</body>
</html>
